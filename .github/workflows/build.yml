name: Собрать мод
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: trypc-jar
          path: build/libs/trypc-1.0.0.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: trypc (сборка ${{ github.run_number }})
          files: build/libs/trypc-1.0.0.jar
